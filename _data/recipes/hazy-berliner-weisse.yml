# Retrospective bottle tasting recorded November 21, 2026. The 2022 batch attribution and Brett source are brewer recollections, not laboratory confirmation.
  - "November 21, 2026 bottle tasting (probable 2022 batch): Brewer reports that these bottles were set aside about four years earlier. The archived recipe also lists 2022-10-08 and 2024-03-10 brew sessions, but the exact bottled session has not been independently confirmed; the displayed recipe date remains the latest recorded session."
  - "Unintended wild fermentation: The beer was originally brewed as a fruited Berliner Weisse, not deliberately inoculated with Brett. Brewer recalls previous Brettanomyces contamination in shared brewing equipment after making an intentional Brett beer, making carryover a plausible source. Brett is strongly suspected based on aroma and history, but the organism and strain have not been tested."
  - "Pellicles appeared inside the bottles during storage, prompting the brewer to put them aside. On rediscovery in 2026, most visible pellicles had receded or disappeared. Their disappearance does not establish that the microbes are gone."
  - "Tasting November 2026: Hazy golden-amber beer with a very foamy pour, pronounced classic Brett-like funk on the nose, very dry finish, minimal sweetness, lively carbonation, and a faint cranberry impression. Brewer described the unexpectedly aged beer as genuinely excellent."
  - "Likely bottle refermentation may explain the dry finish and extra carbonation, but actual yeast identity, gravity change, and whether fermentation continued throughout storage are unmeasured. Chill and open remaining bottles cautiously because of possible overpressure."
